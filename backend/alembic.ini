# Alembic configuration. Run from backend/:  alembic upgrade head   (or: alembic upgrade head --sql)
# The database URL is not set here: migrations/env.py reads DATABASE_URL through settings.py.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Readable, ordered revision file names (0001_..., 0002_...); pass --rev-id to `alembic revision`.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
