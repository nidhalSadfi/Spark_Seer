# Production stack: PostgreSQL, API, worker, and Caddy (dashboard + HTTPS). See DEPLOY.md.
#   docker compose -f docker-compose.prod.yml up -d --build
# Values come from .env. The database is never published to the internet.
x-backend: &backend
  build: ./backend
  image: emberguard-backend
  env_file: .env
  environment:
    # Inside the stack the database host is "db", whatever .env says for local development.
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-emberguard}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-emberguard}
  volumes:
    - ./backend/data:/app/data
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emberguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-emberguard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    <<: *backend

  worker:
    <<: *backend
    command: ["python", "-m", "worker"]

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
